name: Analyze Sakht technical patterns

on:
  push:
    branches: [main]
    paths:
      - 'scripts/analyze_sakht_patterns.py'
      - '.github/workflows/analyze-sakht-patterns.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout analysis code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch archived price history
        run: git fetch origin market-history-checkpoints:refs/remotes/origin/market-history-checkpoints
      - name: Run pattern scan
        run: python scripts/analyze_sakht_patterns.py
      - name: Save report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/sakht_patterns.json reports/sakht_patterns.md
          git commit -m "Add Sakht technical pattern analysis" || echo "No report changes"
          git push origin HEAD:main
      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sakht-technical-patterns
          path: |
            reports/sakht_patterns.json
            reports/sakht_patterns.md
          if-no-files-found: error
