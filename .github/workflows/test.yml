name: Update Iran stock market data # schema diagnostic run

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test.yml'
      - 'scripts/scan_market.py'
  schedule:
    # Saturday through Wednesday, 13:45 Tehran time.
    - cron: "15 10 * * 0-3,6"

permissions:
  contents: write

concurrency:
  group: iran-stock-market-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update Foolad historical prices
        run: python scripts/fetch_foolad.py

      - name: Scan all market symbols
        run: python scripts/scan_market.py

      - name: Commit updated datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update Iran stock market datasets"
            git pull --rebase origin main
            git push
          fi
