name: Update Foolad daily history

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/test.yml'
  schedule:
    # 13:45 Tehran time, Saturday through Wednesday (Iran trading week).
    - cron: "15 10 * * 0-3,6"

permissions:
  contents: write

concurrency:
  group: foolad-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download TSETMC daily history
        run: python scripts/fetch_foolad.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/foolad_daily.csv data/foolad_instrument.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update Foolad daily price history"
            git push
          fi
