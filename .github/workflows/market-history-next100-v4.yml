name: Next 100 unseen Iran market histories v4

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_market_history_next100_v4.py'
      - '.github/workflows/market-history-next100-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iran-market-history-parallel-v6
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CHECKPOINT_BRANCH: market-history-checkpoints-v4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure independent checkpoint branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin market-history-checkpoints-v4
          git switch -c "parallel-market-history-next100-v4-${GITHUB_RUN_ID}" FETCH_HEAD
          git merge --no-edit origin/main

      - name: Fetch next 100 unseen eligible instruments
        run: python scripts/fetch_market_history_next100_v4.py
