name: Base volume 1 market history collector

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_market_history_basevol1.py'
      - '.github/workflows/market-history-basevol1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iran-market-history-basevol1
  cancel-in-progress: false

jobs:
  basevol1:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CHECKPOINT_BRANCH: market-history-basevol1-checkpoints
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure independent checkpoint branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin market-history-basevol1-checkpoints || true
          if git show-ref --verify --quiet refs/remotes/origin/market-history-basevol1-checkpoints; then
            git switch -c "basevol1-history-${GITHUB_RUN_ID}" FETCH_HEAD
            git merge --no-edit origin/main
          else
            git switch -c "basevol1-history-${GITHUB_RUN_ID}"
          fi
      - name: Fetch unseen base-volume-1 instruments
        run: python scripts/fetch_market_history_basevol1.py
